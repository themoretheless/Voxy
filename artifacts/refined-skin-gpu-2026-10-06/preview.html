<!doctype html><html lang="ru"><meta charset="utf-8">
<title>Скелет и мягкие ткани</title>
<style>body{background:#101923;color:#eee;font:18px system-ui;max-width:900px;margin:24px auto;padding:16px}img{width:min(100%,640px);display:block}button,select,input{font:inherit;margin:8px}input{width:65%}pre{font:16px monospace}</style>
<h1>Скелет и мягкие ткани</h1><p>Нейтральная техническая демонстрация. Отдельные объёмы тканей; модель кожи ещё не связана с их деформацией.</p>
<img id="frame" alt="Кадр скелетной анимации"><button id="play">Пауза</button>
<label>Скорость <select id="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option selected value="1">1×</option></select></label>
<input id="seek" type="range" min="0" step="1" aria-label="Кадр"><pre id="receipt"></pre>
<svg viewBox="0 0 800 200" role="img" aria-label="Отклонение свободных центров тканей от жёсткого движения костей во времени" style="width:100%"><text x="40" y="20" fill="white" font-size="14">Отклонение, мм · максимум 11.71</text><path d="M40.00,160.00 L220.00,119.38 L280.00,124.94 L400.00,149.73 L520.00,129.36 L580.00,130.28 L760.00,132.52" fill="none" stroke="#7dd3fc" stroke-width="2"><title>Область 1</title></path><path d="M40.00,160.00 L220.00,119.03 L280.00,124.55 L400.00,149.70 L520.00,129.20 L580.00,129.86 L760.00,132.45" fill="none" stroke="#c4b5fd" stroke-width="2"><title>Область 2</title></path><path d="M40.00,160.00 L220.00,60.70 L280.00,30.00 L400.00,133.23 L520.00,135.02 L580.00,84.78 L760.00,139.79" fill="none" stroke="#fcd34d" stroke-width="2"><title>Область 3</title></path><path d="M40.00,160.00 L220.00,101.62 L280.00,92.53 L400.00,144.87 L520.00,110.28 L580.00,98.88 L760.00,130.62" fill="none" stroke="#86efac" stroke-width="2"><title>Область 4</title></path><line id="cursor" x1="40" x2="40" y1="28" y2="160" stroke="white"/><text x="40" y="185" fill="white" font-size="14">0.00 с</text><text x="720" y="185" fill="white" font-size="14">0.20 с</text></svg>
<script>
const frames=[{"time": 0.0, "image": "frames/frame-0000.png", "samples": [{"sample": 0, "mm": 0.00010001999800039988}, {"sample": 1, "mm": 0.00010001999800039988}, {"sample": 2, "mm": 1.3000000000000001e-05}, {"sample": 3, "mm": 6.568104749469211e-05}]}, {"time": 0.05, "image": "frames/frame-0001.png", "samples": [{"sample": 0, "mm": 3.6603423595691154}, {"sample": 1, "mm": 3.6913910743237435}, {"sample": 2, "mm": 8.947381703007311}, {"sample": 3, "mm": 5.2600049517243805}]}, {"time": 0.066667, "image": "frames/frame-0002.png", "samples": [{"sample": 0, "mm": 3.1586958027404286}, {"sample": 1, "mm": 3.193835041677325}, {"sample": 2, "mm": 11.713812086409828}, {"sample": 3, "mm": 6.079203040752136}]}, {"time": 0.1, "image": "frames/frame-0003.png", "samples": [{"sample": 0, "mm": 0.9257711250530554}, {"sample": 1, "mm": 0.9284678308277567}, {"sample": 2, "mm": 2.4123274062492017}, {"sample": 3, "mm": 1.363078593765231}]}, {"time": 0.133333, "image": "frames/frame-0004.png", "samples": [{"sample": 0, "mm": 2.7612733288251277}, {"sample": 1, "mm": 2.7753154754638256}, {"sample": 2, "mm": 2.2507617898191716}, {"sample": 3, "mm": 4.480251025678249}]}, {"time": 0.15, "image": "frames/frame-0005.png", "samples": [{"sample": 0, "mm": 2.678304199075788}, {"sample": 1, "mm": 2.7156902733054813}, {"sample": 2, "mm": 6.778141674879406}, {"sample": 3, "mm": 5.507612845630491}]}, {"time": 0.2, "image": "frames/frame-0006.png", "samples": [{"sample": 0, "mm": 2.476411191752089}, {"sample": 1, "mm": 2.4827895257878785}, {"sample": 2, "mm": 1.8206851110691822}, {"sample": 3, "mm": 2.646947815195645}]}];
const picture=document.getElementById('frame'),seek=document.getElementById('seek'),play=document.getElementById('play'),speed=document.getElementById('speed'),receipt=document.getElementById('receipt');
seek.max=frames.length-1;
let index=0,playing=true,previous=null,elapsed=0;
function show(){const f=frames[index];picture.src=f.image;seek.value=index;receipt.textContent=`Время ${f.time.toFixed(2)} с · кадр ${index+1}/${frames.length}\nОтклонение тканей от костей:\n`+f.samples.map(s=>`Область ${s.sample+1}: ${s.mm.toFixed(3)} мм`).join('\n');const x=40+720*(f.time-frames[0].time)/(frames.at(-1).time-frames[0].time||1);document.getElementById('cursor').setAttribute('x1',x);document.getElementById('cursor').setAttribute('x2',x);}
play.onclick=()=>{playing=!playing;play.textContent=playing?'Пауза':'Играть';elapsed=0;};
seek.oninput=()=>{index=Number(seek.value);elapsed=0;show();};
function tick(now){if(previous!==null&&playing){elapsed+=(now-previous)/1000*Number(speed.value);let interval=index<frames.length-1?frames[index+1].time-frames[index].time:0.5;while(elapsed>=interval){elapsed-=interval;index=(index+1)%frames.length;show();interval=index<frames.length-1?frames[index+1].time-frames[index].time:0.5;}}previous=now;requestAnimationFrame(tick);}
show();requestAnimationFrame(tick);
</script></html>
