name: CI

on:
  push:
    branches: [main, master, "workspace-refactor-*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Depgraph & Tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check engine dependency boundaries
        run: python3 tools/check_engine_boundaries.py

      - name: Run architectural and source-tree ratchets
        run: cargo test -p voxy_depgraph

      - name: Lint workspace libraries
        run: cargo clippy --workspace --lib -- -D warnings

      - name: Run workspace unit tests
        run: cargo test --workspace --lib
