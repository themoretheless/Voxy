<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Конструктор лица · Voxy</title>
<style>
:root{color-scheme:dark;font-family:system-ui;background:#11151c;color:#e3e9f1}body{max-width:1100px;margin:35px auto;padding:0 24px}h1{font-size:30px;margin-bottom:8px}p{color:#a8b4c5;line-height:1.5}.toolbar{display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#11151cee;padding:16px 0;z-index:1}button,input[type=search]{border:1px solid #394456;border-radius:7px;background:#1d2633;color:inherit;padding:9px 14px}button{cursor:pointer}#groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}section{background:#19212d;border:1px solid #2a3545;border-radius:12px;padding:18px}h2{font-size:17px;margin:0 0 18px}.row{display:grid;grid-template-columns:1fr 78px;gap:8px;margin:13px 0}.row label{font-size:14px}.row input[type=range]{grid-column:1/-1;width:100%;accent-color:#67c7a5}.row input[type=number]{width:65px;background:#101720;color:inherit;border:1px solid #394456;border-radius:4px;padding:3px}#status{color:#67c7a5;align-self:center}small{color:#a8b4c5}a{color:#67c7a5}
</style>
<h1>Конструктор лица</h1><p>Размеры, пропорции и положение частей лица. Изменения автоматически передаются в открытый нативный просмотр Voxy. Единица «×» — доля исходного размера, смещения заданы в миллиметрах.</p>
<div class="toolbar"><input id="search" type="search" placeholder="Нос, губы, ресницы…"><button id="reset">Сбросить всё</button><button id="export">Сохранить пресет</button><button id="import">Загрузить пресет</button><input id="file" type="file" accept=".json" hidden><span id="status">Загрузка…</span></div><div id="groups"></div>
<script>
let schema,values,timer,version=0,writing=false;const status=document.querySelector('#status');
async function persist(){if(writing)return;writing=true;const revision=version;try{const response=await fetch('/preset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});const data=await response.json();if(!response.ok)throw Error(data.error);status.textContent='Пресет сохранён';}catch(e){status.textContent=e.message;}finally{writing=false;if(revision!==version)persist();}}
function changed(){version++;clearTimeout(timer);status.textContent='Сохранение…';timer=setTimeout(persist,150);}
function render(){const query=document.querySelector('#search').value.toLowerCase();const container=document.querySelector('#groups');container.replaceChildren();const groups=new Map();for(const c of schema){if(!(c.group+' '+c.label+' '+c.key).toLowerCase().includes(query))continue;if(!groups.has(c.group)){const section=document.createElement('section'),h=document.createElement('h2');h.textContent=c.group;section.append(h);groups.set(c.group,section);container.append(section);}const row=document.createElement('div');row.className='row';const label=document.createElement('label');label.textContent=c.label+' · '+c.unit;const number=document.createElement('input'),range=document.createElement('input');number.type='number';range.type='range';for(const input of [number,range]){input.min=c.min;input.max=c.max;input.step=c.step;input.value=values[c.key];input.setAttribute('aria-label',c.group+': '+c.label);input.oninput=()=>{const v=Number(input.value);if(!Number.isFinite(v)||v<c.min||v>c.max)return;values[c.key]=v;number.value=v;range.value=v;changed();};}row.append(label,number,range);groups.get(c.group).append(row);}}
document.querySelector('#search').oninput=render;document.querySelector('#reset').onclick=()=>{values=Object.fromEntries(schema.map(c=>[c.key,c.default]));render();changed();};document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(values,null,2)],{type:'application/json'}));a.download='face-preset.json';a.click();URL.revokeObjectURL(a.href);};document.querySelector('#import').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=async e=>{try{const candidate=JSON.parse(await e.target.files[0].text());const response=await fetch('/preset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(candidate)});const result=await response.json();if(!response.ok)throw Error(result.error);values=result;render();status.textContent='Пресет загружен';}catch(error){status.textContent=error.message;}e.target.value='';};
Promise.all([fetch('/schema').then(r=>r.json()),fetch('/preset').then(r=>r.json())]).then(([s,p])=>{schema=s;values=p;render();status.textContent=s.length+' регуляторов';}).catch(e=>status.textContent=e.message);
</script></html>
