[package]
name = "voxy_gpu_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Device-level GPU utilities shared by the renderer and the compute backends"

[dependencies]
thiserror = "2"
wgpu = { version = "30.0.1", features = ["noop"] }
raw-window-handle = "0.6.2"

[dev-dependencies]
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }

[lints]
workspace = true
