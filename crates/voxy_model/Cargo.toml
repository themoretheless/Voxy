[package]
name = "voxy_model"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "glTF model import into renderer meshes and animation rigs"

[dependencies]
blake3.workspace = true
bevy_mikktspace = { path = "../../vendor/bevy_mikktspace" }
voxy_render = { path = "../voxy_render" }
voxy_animation = { path = "../voxy_animation" }
glam = { workspace = true, features = ["bytemuck"] }
gltf = { workspace = true, features = ["utils", "names"] }
image = { workspace = true, features = ["png", "jpeg", "hdr"] }
serde_json.workspace = true
serde.workspace = true

[dev-dependencies]
bytemuck = { workspace = true, features = ["derive"] }
pollster.workspace = true
wgpu = { workspace = true, features = ["noop"] }
voxy_gpu_core = { path = "../voxy_gpu_core" }

[lints]
workspace = true
