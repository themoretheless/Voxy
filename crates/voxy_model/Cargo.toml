[package]
name = "voxy_model"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "glTF model import into renderer meshes and animation rigs"

[dependencies]
voxy_render = { path = "../voxy_render" }
voxy_animation = { path = "../voxy_animation" }
glam = { version = "0.33.6", features = ["bytemuck"] }
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "hdr"] }
serde_json = "1.0"

[dev-dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
wgpu = { version = "30.0.1", features = ["noop"] }
voxy_gpu_core = { path = "../voxy_gpu_core" }

[lints]
workspace = true
