[package]
name = "voxy_cuda"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
cuda = ["dep:cudarc"]

[dependencies]
physics = { path = "../physics" }
cudarc = { version = "0.19.9", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12000"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Mirrors the workspace allow list for the stylistic lints this crate trips;
# the crate keeps its own table because it needs `unsafe_code = "deny"`.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
default_trait_access = "allow"
struct_excessive_bools = "allow"
unnecessary_wraps = "allow"
if_same_then_else = "allow"

[target.'cfg(target_os = "linux")'.dev-dependencies]
ash = "0.38.0"
