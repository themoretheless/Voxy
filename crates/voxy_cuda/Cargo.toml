[package]
name = "voxy_cuda"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
cuda = ["dep:cudarc"]

[dependencies]
physics = { path = "../physics" }
cudarc = { version = "0.19.9", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12000"] }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
ash = "0.38.0"
