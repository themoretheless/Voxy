[package]
name = "voxy_ray_probe"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["face-demo"]
face-demo = ["dep:voxy_demos"]

[dependencies]
bytemuck = "1.25.0"
voxy_demos = { path = "../voxy_demos", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"] }
voxy_render = { path = "../voxy_render" }
wgpu = "30.0.1"
pollster = "1.0.1"
glam = "0.33.6"
half = "2.7.1"
serde_json = "1.0"

[dev-dependencies]
voxy_runtime = { path = "../voxy_runtime" }
voxy_ui = { path = "../voxy_ui" }
voxy_ui_winit = { path = "../voxy_ui_winit" }
winit = "0.30.13"

[lints]
workspace = true
