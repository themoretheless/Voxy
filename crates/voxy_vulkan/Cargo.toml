[package]
name = "voxy_vulkan"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
cuda = ["dep:voxy_cuda", "voxy_cuda/cuda"]

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
voxy_cuda = { path = "../voxy_cuda", optional = true }
ash.workspace = true
wgpu.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common", "Win32_Security"] }

[lints]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dev-dependencies]
voxy_gpu = { path = "../voxy_gpu" }
voxy_render = { path = "../voxy_render" }
pollster.workspace = true
winit.workspace = true

[[example]]
name = "cuda_gravity_render"
required-features = ["cuda"]

[[example]]
name = "cuda_gravity_window"
required-features = ["cuda"]
