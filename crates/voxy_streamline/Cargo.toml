[package]
name = "voxy_streamline"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
native = []
wgpu-dx12 = ["native", "dep:wgpu", "dep:windows"]
render-policy = ["dep:voxy_render"]
scene-dx12 = ["wgpu-dx12", "render-policy"]

[dependencies]
glam.workspace = true
voxy_render = { path = "../voxy_render", optional = true }
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["std", "dx12"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[dev-dependencies]
pollster.workspace = true
half.workspace = true

[build-dependencies]
cc = "1.4.4"

[lints]
workspace = true
