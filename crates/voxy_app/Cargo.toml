[package]
name = "voxy_app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
experimental-strand-fraction-reuse = ["physics/experimental-strand-fraction-reuse", "voxy_demos/experimental-strand-fraction-reuse"]
experimental-reusable-query-workers = ["physics/experimental-reusable-query-workers", "voxy_demos/experimental-reusable-query-workers"]
cuda = ["voxy_gpu/cuda", "voxy_cuda/cuda", "voxy_demos/cuda"]

[dependencies]
voxy_model = { path = "../voxy_model" }
voxy_shell = { path = "../voxy_shell" }
voxy_demos = { path = "../voxy_demos" }
wgpu = { version = "30.0.1", features = ["noop"] }
voxy_core = { path = "../voxy_core" }
voxy_editor = { path = "../voxy_editor" }
voxy_assets = { path = "../voxy_assets" }
voxy_input = { path = "../voxy_input" }
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
physics = { path = "../physics" }
physics_voxel = { path = "../physics_voxel" }
pollster = "1.0.1"
glam = "0.33.6"
voxy_animation = { path = "../voxy_animation" }
voxy_text = { path = "../voxy_text" }
voxy_rush = { path = "../voxy_rush", features = ["physics-events"] }
voxy_gameplay = { path = "../voxy_gameplay" }
voxy_scene = { path = "../voxy_scene" }
voxy_render = { path = "../voxy_render" }
voxy_gpu = { path = "../voxy_gpu" }
voxy_cuda = { path = "../voxy_cuda" }
voxy_runtime = { path = "../voxy_runtime" }
voxy_world = { path = "../voxy_world" }
winit = "0.30.13"

[lints]
workspace = true

[[example]]
name = "pinball"
path = "examples/pinball/main.rs"
test = true

[dev-dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
