[package]
name = "voxy_xr"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
voxy_ui = { path = "../voxy_ui" }
openxr = { version = "0.22.0", default-features = false, features = ["loaded"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Mirrors the workspace allow list for the stylistic lints this crate trips;
# the crate keeps its own table because it needs `unsafe_code = "deny"`.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
default_trait_access = "allow"
struct_excessive_bools = "allow"
unnecessary_wraps = "allow"
if_same_then_else = "allow"
