[package]
name = "voxy_editor"
default-run = "voxy_editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
voxy_model = { path = "../voxy_model" }
thiserror.workspace = true
physics = { path = "../physics" }
voxy_animation = { path = "../voxy_animation" }
getrandom = "0.3.4"
voxy_audio_device = { path = "../voxy_audio_device" }
voxy_audio = { path = "../voxy_audio" }
blake3.workspace = true
serde.workspace = true
gltf = { workspace = true, features = ["utils", "names"] }
voxy_gameplay = { path = "../voxy_gameplay" }
voxy_input = { path = "../voxy_input" }
glam = { workspace = true, features = ["serde"] }
serde_json.workspace = true
pollster.workspace = true
voxy_text = { path = "../voxy_text" }
voxy_ui = { path = "../voxy_ui" }
voxy_assets = { path = "../voxy_assets" }
voxy_player = { path = "../voxy_player" }
voxy_scene = { path = "../voxy_scene" }
voxy_render = { path = "../voxy_render" }
winit.workspace = true
wgpu.workspace = true

[dev-dependencies]
image = { workspace = true, features = ["png"] }
base64 = "0.22"

[lints]
workspace = true

