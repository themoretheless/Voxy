[package]
name = "voxy_editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
getrandom = "0.3.4"
voxy_audio_device = { path = "../voxy_audio_device" }
voxy_audio = { path = "../voxy_audio" }
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
voxy_gameplay = { path = "../voxy_gameplay" }
voxy_input = { path = "../voxy_input" }
glam = { version = "0.33.6", features = ["serde"] }
serde_json = "1.0"
pollster = "1.0.1"
voxy_text = { path = "../voxy_text" }
voxy_ui = { path = "../voxy_ui" }
voxy_assets = { path = "../voxy_assets" }
voxy_scene = { path = "../voxy_scene" }
voxy_render = { path = "../voxy_render" }
winit = "0.30.13"
wgpu = "30.0.1"

[lints]
workspace = true

