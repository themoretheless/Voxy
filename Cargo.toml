[workspace]
resolver = "3"
exclude = ["vendor/bevy_mikktspace"]
members = [
    "crates/voxy_core",
    "crates/voxy_assets",
    "crates/voxy_audio",
    "crates/voxy_audio_device",
    "crates/voxy_input",
    "crates/voxy_ui",
    "crates/voxy_text",
    "crates/voxy_ui_winit",
    "crates/voxy_navigation",
    "crates/voxy_scene",
    "crates/voxy_gameplay",
    "crates/voxy_rush",
    "crates/voxy_world",
    "crates/voxy_storage",
    "crates/voxy_mesher",
    "crates/voxy_lighting",
    "crates/voxy_animation",
    "crates/physics",
    "crates/physics_voxel",
    "crates/voxy_runtime",
    "crates/voxy_time",
    "crates/voxy_render",
    "crates/voxy_water",
    "crates/voxy_model",
    "crates/voxy_web",
    "crates/voxy_ray_probe",
    "crates/voxy_app",
    "crates/voxy_shell",
    "crates/voxy_demos",
    "crates/voxy_editor",
    "crates/voxy_mobile",
    "crates/voxy_cuda",
    "crates/voxy_vulkan",
    "crates/voxy_gpu",
    "crates/voxy_gpu_core",
    "crates/voxy_xr",
    "crates/voxy_streamline",
    "crates/voxy_depgraph",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Stylistic pedantic lints the existing code base violates in bulk (several
# thousand sites). Kept at `allow` so the `-D warnings` gate guards the remaining
# correctness-oriented lints; re-enable individually when cleaning a crate.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
needless_range_loop = "allow"
default_trait_access = "allow"
many_single_char_names = "allow"
wildcard_imports = "allow"
redundant_closure_for_method_calls = "allow"
similar_names = "allow"
needless_pass_by_value = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
type_complexity = "allow"
map_unwrap_or = "allow"
too_many_arguments = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
uninlined_format_args = "allow"
semicolon_if_nothing_returned = "allow"
manual_range_contains = "allow"
items_after_test_module = "allow"
must_use_candidate = "allow"
single_match_else = "allow"
unnecessary_wraps = "allow"
large_types_passed_by_value = "allow"
manual_let_else = "allow"
unused_self = "allow"
if_not_else = "allow"
match_same_arms = "allow"
explicit_iter_loop = "allow"
excessive_precision = "allow"
used_underscore_binding = "allow"
collapsible_if = "allow"
needless_borrow = "allow"
implicit_clone = "allow"
# Examples deliberately include app modules through `#[path]`.
duplicate_mod = "allow"

[patch.crates-io]
wgpu = { path = "vendor/wgpu" }
wgpu-hal = { path = "vendor/wgpu-hal" }
