[workspace]
resolver = "3"
members = [
    "crates/voxy_core",
    "crates/voxy_world",
    "crates/voxy_storage",
    "crates/voxy_mesher",
    "crates/voxy_lighting",
    "crates/voxy_animation",
    "crates/physics",
    "crates/voxy_runtime",
    "crates/voxy_render",
    "crates/voxy_app",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
