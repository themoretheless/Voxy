[workspace]
resolver = "3"
members = [
    "crates/voxy_core",
    "crates/voxy_assets",
    "crates/voxy_audio",
    "crates/voxy_audio_device",
    "crates/voxy_input",
    "crates/voxy_ui",
    "crates/voxy_text",
    "crates/voxy_ui_winit",
    "crates/voxy_navigation",
    "crates/voxy_scene",
    "crates/voxy_gameplay",
    "crates/voxy_rush",
    "crates/voxy_world",
    "crates/voxy_storage",
    "crates/voxy_mesher",
    "crates/voxy_lighting",
    "crates/voxy_animation",
    "crates/physics",
    "crates/physics_voxel",
    "crates/voxy_runtime",
    "crates/voxy_time",
    "crates/voxy_render",
    "crates/voxy_web",
    "crates/voxy_ray_probe",
    "crates/voxy_app",
    "crates/voxy_editor",
    "crates/voxy_mobile",
    "crates/voxy_cuda",
    "crates/voxy_vulkan",
    "crates/voxy_gpu",
    "crates/voxy_xr",
    "crates/voxy_streamline",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[patch.crates-io]
wgpu = { path = "vendor/wgpu" }
wgpu-hal = { path = "vendor/wgpu-hal" }
