[workspace]
resolver = "3"
members = [
    "crates/voxy_core",
    "crates/voxy_assets",
    "crates/voxy_audio",
    "crates/voxy_audio_device",
    "crates/voxy_input",
    "crates/voxy_ui",
    "crates/voxy_text",
    "crates/voxy_ui_winit",
    "crates/voxy_navigation",
    "crates/voxy_scene",
    "crates/voxy_gameplay",
    "crates/voxy_rush",
    "crates/voxy_world",
    "crates/voxy_storage",
    "crates/voxy_mesher",
    "crates/voxy_lighting",
    "crates/voxy_animation",
    "crates/physics",
    "crates/physics_voxel",
    "crates/voxy_runtime",
    "crates/voxy_time",
    "crates/voxy_render",
    "crates/voxy_web",
    "crates/voxy_ray_probe",
    "crates/voxy_app",
    "crates/voxy_demos",
    "crates/voxy_editor",
    "crates/voxy_mobile",
    "crates/voxy_cuda",
    "crates/voxy_vulkan",
    "crates/voxy_gpu",
    "crates/voxy_xr",
    "crates/voxy_streamline",
    "crates/voxy_depgraph",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Stylistic pedantic lints the existing code base violates in bulk (several
# thousand sites). Kept at `allow` so the `-D warnings` gate guards the remaining
# correctness-oriented lints; re-enable individually when cleaning a crate.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
needless_range_loop = "allow"
default_trait_access = "allow"
many_single_char_names = "allow"
wildcard_imports = "allow"
redundant_closure_for_method_calls = "allow"
similar_names = "allow"
needless_pass_by_value = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
type_complexity = "allow"
map_unwrap_or = "allow"
too_many_arguments = "allow"
doc_markdown = "allow"
match_wildcard_for_single_variants = "allow"
manual_midpoint = "allow"
struct_excessive_bools = "allow"
bool_to_int_with_if = "allow"
uninlined_format_args = "allow"
semicolon_if_nothing_returned = "allow"
manual_range_contains = "allow"
items_after_test_module = "allow"
must_use_candidate = "allow"
single_match_else = "allow"
unnecessary_wraps = "allow"
large_enum_variant = "allow"
large_types_passed_by_value = "allow"
manual_let_else = "allow"
unused_self = "allow"
if_not_else = "allow"
match_same_arms = "allow"
ignored_unit_patterns = "allow"
explicit_iter_loop = "allow"
excessive_precision = "allow"
used_underscore_binding = "allow"
borrow_as_ptr = "allow"
unnecessary_debug_formatting = "allow"
format_push_string = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
assigning_clones = "allow"
filter_map_bool_then = "allow"
unnecessary_unwrap = "allow"
suspicious_arithmetic_impl = "allow"
inconsistent_struct_constructor = "allow"
needless_continue = "allow"
needless_borrow = "allow"
range_plus_one = "allow"
needless_option_as_deref = "allow"
let_unit_value = "allow"
manual_inspect = "allow"
manual_is_multiple_of = "allow"
fn_params_excessive_bools = "allow"
comparison_chain = "allow"
format_collect = "allow"
case_sensitive_file_extension_comparisons = "allow"
implicit_clone = "allow"
large_stack_arrays = "allow"
field_reassign_with_default = "allow"
pub_underscore_fields = "allow"
wrong_self_convention = "allow"
zero_sized_map_values = "allow"
double_must_use = "allow"
inline_always = "allow"
maybe_infinite_iter = "allow"
manual_clamp = "allow"
manual_checked_ops = "allow"
return_self_not_must_use = "allow"
needless_update = "allow"
nonminimal_bool = "allow"
ref_option = "allow"
needless_for_each = "allow"
cloned_ref_to_slice_refs = "allow"
assertions_on_constants = "allow"
# Examples deliberately include app modules through `#[path]`.
duplicate_mod = "allow"

[patch.crates-io]
wgpu = { path = "vendor/wgpu" }
wgpu-hal = { path = "vendor/wgpu-hal" }
